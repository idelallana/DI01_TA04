<!-- TODO (Apartado 1): Encabezado con ion-header, ion-toolbar e ion-title -->
<ion-header [translucent]="true">
  <ion-toolbar>
      <ion-title>
      <!-- TODO: Escribe aquí el nombre de tu aplicación -->
      Mi aplicación
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <!-- TODO (Apartado 3 – Two-way Binding):
       Añadir un ion-item con ion-input para filtrar la lista en tiempo real.
       - Haced uso de la variable "busqueda" en el ion-input.
       - Añade un placeholder descriptivo.
       Referencia de la teoría (apartado 3 – Two-way Binding):
         <ion-input [(ngModel)]="nombre"></ion-input>
  -->
  <ion-item>
    <ion-input
      placeholder="Buscar elemento"
      [value]="busqueda()"
      //Se ejecuta cada vez que la persona escribe algo
       //texto que el usuario escribe: &event...
      (ionInput)="busqueda.set($event.detail.value ?? '')">
    </ion-input>
  </ion-item>

  <!-- TODO (Apartado 1 + 2 + 3):
       Lista de elementos.
       - Usa <ion-list> como contenedor.
       - Itera sobre elementosFiltrados con @for (apartado 4 de la teoría, ya disponible).
       - Cada fila: Un ion-item y tendremos <ion-label>.
         · <h2> con el nombre del elemento.
         · <p> con la descripción.
       - Muestra al menos 5 elementos (defínelos en home.page.ts).

       Referencia de la teoría (apartado 1 – ion-list, ion-item, ion-label):
         <ion-list>
           <ion-item>
             <ion-label>
               <h2>Nombre</h2>
               <p>Descripción</p>
             </ion-label>
           </ion-item>
         </ion-list>
  -->
  <ion-list>
    <!--Nombre de la variable temporal "libros", cada elemento individual dentro del bucle-->
    @for (libros of elementosFiltrados(); track libros.id) {
      <!--Llamada al método verDetalle-->
      <ion-item (click)="verDetalle(libros)" detail="true" button="true">
        <ion-label>
          <h2>{{ libros.titulo }}</h2>
          <p>{{ libros.escritora }} — {{ libros.categoria }} — {{ libros.editorial }}</p>
        </ion-label>
      </ion-item>
    } @empty {
      <p>No hay resultados.</p>
    }
  </ion-list>

  <!-- TODO (Apartado 1 + 3 – Event Binding + Property Binding):
       Añadir un <ion-button> que:
       · Al pulsarlo llame a mostrarToast()
       · Esté deshabilitado si no hay elementos en la lista (usa la variable "hayElementos" para esto).

       Referencia de la teoría (apartado 3 – Event Binding y Property Binding):
         <ion-button [disabled]="!formValido" (click)="guardar()">Guardar</ion-button>
  -->
  <ion-button expand="block" [disabled]="!hayElementos()" (click)="mostrarToast()">Mostrar mensaje</ion-button>

</ion-content>
